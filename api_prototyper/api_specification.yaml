openapi: 3.0.3
info:
  title: Inventory API
  version: 1.0.0
paths:
  /products:
    get:
      summary: List products
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Successful response
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
    post:
      summary: Create product
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
        '400':
          description: Bad request
        '401':
          description: Unauthorized
  /products/{id}:
    get:
      summary: Get product by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
        '404':
          description: Product not found
    put:
      summary: Update product
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Updated
        '404':
          description: Product not found
    delete:
      summary: Delete product
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted
        '404':
          description: Product not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT